# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# GitHub's OIDC token proves this repository owns the io.github.narcisbodea/* namespace,
# so no secret is stored anywhere. Publish the same version to npm first: the registry
# checks that @narcisbodea/smstunnel-mcp on npm has the matching "mcpName".
name: Publish to the MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help > /dev/null

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
